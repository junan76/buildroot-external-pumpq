image boot.vfat {
    vfat {
        label = "bootfs"
        files = {
            "zImage",
            "fsdev-fsmp1a.dtb",
            "fsdev-fsmp1a-scmi.dtb",
            "extlinux"
        }
    }
    size = 32M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition fsbl1 {
		image = "tf-a-fsdev-fsmp1a.stm32"
        size = 256K
	}

	partition fsbl2 {
		image = "tf-a-fsdev-fsmp1a.stm32"
        size = 256K
	}

	partition fip {
		image = "fip.bin"
		size = 4M
	}

    partition u-boot-env {
        size = 2M
    }

    partition bootfs {
        image = "boot.vfat"
        bootable = "yes"
    }

	partition rootfs {
		image = "rootfs.ext4"
	}
}